<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Сторінку не знайдено — поверніться на головну сторінку Indi Mops.">
  <base href="/">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
  <title>Сторінку не знайдено — Indi Mops</title>
</head>
<body class="site-body">
  <a class="skip-link" href="/404.html#main-content" data-error-skip>До вмісту</a>
  <site-header lang="uk"></site-header>

  <main id="main-content" class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <img
        class="error-card__image"
        src="/assets/404.gif"
        width="319"
        height="253"
        alt="Засмучена анімована героїня лежить, підперши голову рукою"
        data-error-image
      >
      <p class="error-card__code" data-error-code>Помилка 404</p>
      <h1 id="error-title" data-error-title>Сторінка кудись утекла</h1>
      <p data-error-message>
        Можливо, посилання застаріло або в адресі причаїлася помилка. На головній усе ще
        є проєкти, переклади й трохи ностальгії.
      </p>
      <a class="button button--primary" href="/index.html" data-error-home>
        <span data-error-home-label>Повернутися на головну</span>
        <span class="button__arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <site-footer lang="uk"></site-footer>
</body>
</html>
